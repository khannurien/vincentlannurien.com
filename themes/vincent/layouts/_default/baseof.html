<!doctype html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
  {{ partial "head.html" . }}

  <body id="top">
    {{ partial "background.html" . }}

    <div id="content">
      {{ partial "header.html" . }}

      <main id="main">
        {{ block "main" . }}{{ end }}
      </main>

      {{ partial "footer.html" . }}
    </div>

    {{ partial "back-to-top.html" . }}
  </body>
</html>
